# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse
set -g mouse on

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on close
set -g renumber-windows on

# No delay on escape
set -sg escape-time 0

# Longer scrollback
set -g history-limit 50000

# Intuitive splits (| and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# Navigate panes with Alt+arrow (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Ctrl+arrow (no prefix)
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 2
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 2

# Switch windows with Shift+arrow (no prefix)
bind -n S-Left previous-window
bind -n S-Right next-window

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -sel clip"

# Status bar — Daemon2 colors
set -g status-style "bg=#210e15,fg=#5df4fe"
set -g status-left "#[fg=#210e15,bg=#ee00ff,bold] #S #[default] "
set -g status-right "#[fg=#a1a9b1]%H:%M #[fg=#ee00ff]%d-%b"
set -g status-left-length 20
set -g window-status-current-style "fg=#210e15,bg=#5df4fe,bold"
set -g window-status-style "fg=#a1a9b1"
set -g pane-border-style "fg=#355d65"
set -g pane-active-border-style "fg=#5df4fe"
set -g message-style "bg=#355d65,fg=#5df4fe"

# No tmux startup logo or animation here; zsh/fastfetch provides the static launch logo.
