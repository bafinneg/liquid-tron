# Tron Compute — Kitty terminal colors
# Managed by apply-theme.sh — do not edit directly

foreground       #c0c0d0
background       #0a0a14
cursor           #ff8c00

# Selection
selection_foreground #000000
selection_background #0072ff

# Black (color0 / color8)
color0  #06060c
color8  #505060

# Red (color1 / color9)  — errors
color1  #ff003c
color9  #ff003c

# Green (color2 / color10)  — success
color2  #00ff9f
color10 #00ff9f

# Yellow (color3 / color11)  — warnings, active
color3  #ff8c00
color11 #ff8c00

# Blue (color4 / color12)  — secondary
color4  #0072ff
color12 #0072ff

# Magenta (color5 / color13)  — URGENT ONLY (preserved for ANSI compat)
color5  #ff003c
color13 #ff003c

# Cyan (color6 / color14)  — primary chrome
color6  #0abdc6
color14 #0abdc6

# White (color7 / color15)
color7  #c0c0d0
color15 #e0e0f0
