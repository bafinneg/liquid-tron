# Kitty behavior config for the Liquid Tron desktop.
# Palette is owned by the theme system; theme.conf is generated by shared/themes/apply-theme.sh.
# No background image is configured.

font_family      IosevkaTerm Nerd Font Mono
font_size        11
bold_font        auto
italic_font      auto
bold_italic_font auto

# Palette is owned by the theme system (Tron Compute).
# theme.conf is generated by shared/themes/apply-theme.sh — do not inline colors here.
include theme.conf

cursor_shape     underline
cursor_blink_interval 0.5

window_padding_width 12
# FEAT-lt26r-3 (05 OD3): Kitty draws its own background at 90 %; SUPER+O/gaming restore read this line.
background_opacity 0.90
text_fg_override_threshold 4.5
enable_audio_bell no
