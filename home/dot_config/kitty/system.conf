# kitty session for the System workspace (FEAT-workspace-ux-overhaul Phase 2).
# Loaded by kitty-system.desktop via:
#   kitty --class=kitty-system --session=~/.config/kitty/system.conf
#
# Single window running btop. Sprawl beyond btop (logs, journalctl, etc.) is
# handled by spawning more tabs/windows interactively, not by pre-baking them
# here — keeps the boot state predictable.

launch btop
