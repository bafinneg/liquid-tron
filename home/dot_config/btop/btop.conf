#? Config file for btop v.1.4.6
#  Tron Compute — managed via Stow
#  Do not edit ~/.config/btop/ directly

color_theme = "liquid-tron"
theme_background = false
truecolor = true
force_tty = false

#* Layout presets (switch with P key or number keys 0-9)
#* 0: all boxes  1: cpu+gpu+proc (gaming)  2: cpu+mem+net (overview)
presets = "cpu:0:default,mem:0:default,net:0:default,proc:0:default,gpu0:0:default cpu:1:default,proc:0:default,gpu0:0:default cpu:0:braille,mem:0:braille,net:0:braille"

vim_keys = true
rounded_corners = true
terminal_sync = true

graph_symbol = "braille"
graph_symbol_cpu = "default"
graph_symbol_gpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"

#* Show CPU, memory, network, processes, and GPU
shown_boxes = "cpu mem net proc gpu0"

#* 1 second update — snappy on 7800X3D
update_ms = 1000

proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = true
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true
proc_info_smaps = false
proc_left = false
proc_filter_kernel = false
proc_aggregate = false
keep_dead_proc_usage = false

#* Upper graph: total CPU, lower graph: user (shows user vs system split)
cpu_graph_upper = "total"
cpu_graph_lower = "user"

show_gpu_info = "On"
cpu_invert_lower = true
cpu_single_graph = false
cpu_bottom = false
show_uptime = true
show_cpu_watts = true
check_temp = true
cpu_sensor = "Auto"
show_coretemp = true
cpu_core_map = ""
temp_scale = "celsius"
base_10_sizes = false
show_cpu_freq = true
freq_mode = "first"

#* Clock with hostname and uptime
clock_format = "/host | /uptime | %X"

background_update = true
custom_cpu_name = ""
disks_filter = ""
mem_graphs = true
mem_below_net = false
zfs_arc_cached = true
show_swap = true
swap_disk = true
show_disks = true
only_physical = true
use_fstab = true
zfs_hide_datasets = false
disk_free_priv = false
show_io_stat = true
io_mode = false
io_graph_combined = false
io_graph_speeds = ""

net_download = 100
net_upload = 100
net_auto = true
net_sync = true
net_iface = "eno1"
base_10_bitrate = "Auto"

show_battery = false
selected_battery = "Auto"
show_battery_watts = true

log_level = "WARNING"

#* CRITICAL: keep false — btop will overwrite stow symlink on exit if true
save_config_on_exit = false

nvml_measure_pcie_speeds = true
rsmi_measure_pcie_speeds = true
gpu_mirror_graph = true
shown_gpus = "nvidia"
custom_gpu_name0 = ""
custom_gpu_name1 = ""
custom_gpu_name2 = ""
custom_gpu_name3 = ""
custom_gpu_name4 = ""
custom_gpu_name5 = ""
