# Liquid Tron fuzzel launcher theme for 7800x.
# Managed in home-infra via Stow-equivalent symlink from ~/.config/fuzzel/fuzzel.ini.

[main]
namespace=launcher
font=IosevkaTerm Nerd Font:size=12
prompt=APPS
placeholder=Search...
icon-theme=Nordzy-cyan-dark
icons-enabled=yes
match-mode=fzf
fields=filename,name,generic,exec,categories,keywords,comment
show-actions=yes
terminal=kitty -e
width=48
lines=8
horizontal-pad=20
vertical-pad=18
inner-pad=8
line-height=24
letter-spacing=0
image-size-ratio=0.25
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

[colors]
background=0d0d1aee
text=c0c0d0ff
message=0abdc6ff
prompt=0abdc6ff
placeholder=707080ff
input=c0c0d0ff
match=0abdc6ff
selection=0abdc6ff
selection-text=0d0d1aff
selection-match=0d0d1aff
counter=707080ff
border=0abdc6ff

[border]
width=2
radius=8
selection-radius=6
