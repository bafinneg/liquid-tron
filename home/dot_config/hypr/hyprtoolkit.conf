# FEAT-lt26r-2 OD-E: Liquid Tron theme for hyprtoolkit 0.6 apps (hyprpolkitagent 0.2
# auth prompt, hyprland-dialog). hyprtoolkit reads this file from
# $XDG_CONFIG_HOME/hypr/hyprtoolkit.conf or ~/.config/hypr/hyprtoolkit.conf and
# watches it with inotify. Tron Compute roles: near-black surfaces, cyan structure
# and accent, blue fill. Radius 8/6, never above 10.

background = 0xFF0A0A14
base = 0xFF0E0E1C
alternate_base = 0xFF0D0D1A
text = 0xFFC0C0D0
bright_text = 0xFFE0E0F0
accent = 0xFF0ABDC6
accent_secondary = 0xFF0072FF

rounding_large = 8
rounding_small = 6

font_family = IosevkaTerm Nerd Font
font_family_monospace = IosevkaTerm Nerd Font Mono
icon_theme = Nordzy-cyan-dark
