# session-restore.conf — Override map for Hyprland session restore.
#
# [skip]     — classes that should never be relaunched (already handled by
#              exec-once in autostart.conf, or managed by systemd).
# [override] — classes where the /proc/<pid>/cmdline capture is wrong;
#              value is the exact cmdline to use instead.
#
# Add entries here as edge cases surface on first restore cycle.

[skip]
zen               = SKIP
discord           = SKIP
kitty-system      = SKIP

[override]
# Example: flatpak app where bwrap cmdline is captured instead of the app.
# spotify = flatpak run com.spotify.Client
